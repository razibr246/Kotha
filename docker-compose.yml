services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kotha
      POSTGRES_PASSWORD: kotha
      POSTGRES_DB: kotha
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotha"]
      interval: 2s
      retries: 20

  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://kotha:kotha@db:5432/kotha
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "python -m kotha.seed && uvicorn kotha.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
