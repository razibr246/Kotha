<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kotha · Order support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@500;600&family=Montserrat:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbeee0;
    --grid: rgba(180, 140, 100, .14);
    --card: #fdf6ef;
    --line: #e7d8c8;
    --ink: #1b2233;
    --muted: #5d6475;
    --blue: #3b63e0;
    --blue-2: #2a48c9;
    --green: #2f6b45;
    --green-bg: #e6eedf;
    --radius: 26px;
    --sans: "Montserrat", "Hind Siliguri", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 44px 44px,
      radial-gradient(1200px 600px at 85% -10%, #d9d3e6 0%, transparent 60%),
      var(--bg);
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .shell {
    width: min(560px, 100%);
    height: min(820px, calc(100vh - 48px));
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
    box-shadow: 0 30px 60px -40px rgba(80, 50, 20, .35);
  }
  header {
    padding: 22px 26px 16px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  }
  h1 { font-family: "DM Serif Display", serif; font-weight: 400; font-size: 38px; margin: 0; line-height: 1; letter-spacing: -.5px; }
  .meta { font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: .6px; margin-top: 8px; }
  .status { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
            color: var(--green); background: var(--green-bg); border: 1px solid #c9dbc5;
            padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
  .status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                    background: #3d9a5f; margin-right: 7px; vertical-align: 1px; }

  main {
    overflow-y: auto; padding: 24px 22px 12px;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 34px 34px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 34px 34px,
      linear-gradient(180deg, #f8e3cc 0%, #f7e6d3 100%);
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 82%; font-size: 17px; line-height: 1.45; animation: rise .22s ease-out; }
  .user {
    align-self: flex-end; color: #fff;
    background: linear-gradient(135deg, var(--blue), var(--blue-2));
    padding: 13px 22px; border-radius: 22px 22px 6px 22px;
  }
  .bot {
    align-self: flex-start; background: #fdf6ef; border: 1px solid var(--line);
    padding: 15px 22px 13px; border-radius: 22px 22px 22px 6px;
  }
  .bot[lang="bn"], .user[lang="bn"] { font-family: "Hind Siliguri", var(--sans); font-size: 18px; }
  .sources { display: block; margin-top: 9px; font-family: var(--mono); font-size: 12.5px; color: var(--green);
             background: none; border: 0; padding: 0; cursor: pointer; text-align: left; letter-spacing: .3px; }
  .sources:hover { text-decoration: underline; }
  .refs { display: none; margin: 8px 0 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .refs.open { display: block; }
  .refs li { padding: 2px 0; }
  .handoff { margin-top: 10px; font-size: 13px; color: var(--blue-2); font-weight: 600; }
  .typing { align-self: flex-start; display: flex; gap: 5px; padding: 16px 20px; background: #fdf6ef;
            border: 1px solid var(--line); border-radius: 22px 22px 22px 6px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #b9a58f; animation: blink 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  .intro { text-align: center; color: var(--muted); font-size: 14px; margin: 8px auto 4px; max-width: 360px; line-height: 1.5; }

  footer { padding: 14px 18px 18px; border-top: 1px solid var(--line); background: var(--card); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
  .chip { flex: none; font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .4px; color: var(--green);
          background: var(--green-bg); border: 1px solid #c9dbc5; border-radius: 999px; padding: 7px 13px; cursor: pointer; }
  .chip[lang="bn"] { font-family: "Hind Siliguri", var(--sans); font-size: 14px; padding: 5px 13px; }
  .chip:hover { background: #dbe7d3; }
  form { display: flex; gap: 10px; }
  input {
    flex: 1; font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 16px; outline: none;
  }
  input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59, 99, 224, .15); }
  button.send {
    font: 600 16px var(--sans); color: #fff; border: 0; border-radius: 16px; padding: 0 22px; cursor: pointer;
    background: linear-gradient(135deg, var(--blue), var(--blue-2));
  }
  button.send:disabled { opacity: .55; cursor: default; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes blink { 50% { opacity: .3; } }
  @media (max-width: 520px) {
    body { padding: 0; } .shell { height: 100vh; border-radius: 0; border: 0; }
    .msg { max-width: 90%; font-size: 16px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>Kotha</h1>
      <div class="meta" id="shopline">Order support · বাংলা / English</div>
    </div>
    <span class="status" id="engine">online</span>
  </header>

  <main id="log" aria-live="polite">
    <p class="intro">Ask about an order, delivery, payment or returns. Write in Bangla or English.<br>
      অর্ডার, ডেলিভারি, পেমেন্ট বা রিটার্ন নিয়ে জিজ্ঞেস করুন।</p>
  </main>

  <footer>
    <div class="chips" id="chips">
      <button class="chip" type="button">Where is order #4821?</button>
      <button class="chip" type="button" lang="bn">অর্ডার #৪৮১০ কবে পাব?</button>
      <button class="chip" type="button">How long do refunds take?</button>
      <button class="chip" type="button" lang="bn">ডেলিভারি চার্জ কত?</button>
      <button class="chip" type="button">Order 4807 status</button>
    </div>
    <form id="form" autocomplete="off">
      <input id="input" placeholder="Type a message… / লিখুন…" maxlength="2000" aria-label="Message">
      <button class="send" id="send">Send</button>
    </form>
  </footer>
</div>

<script>
const params = new URLSearchParams(location.search);
const shop = params.get("shop") || null;
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = [];

const BN = /[ঀ-৿]/;

function bubble(role, text, lang) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.lang = lang || (BN.test(text) ? "bn" : "en");
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function sourcesLine(el, sources, lang) {
  if (!sources || !sources.count) return;
  const bn = lang === "bn";
  const btn = document.createElement("button");
  btn.className = "sources";
  btn.type = "button";
  const n = bn ? String(sources.count).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]) : sources.count;
  const word = bn ? "টি সোর্স" : (sources.count > 1 ? " sources" : " source");
  btn.textContent = `${n}${word} · ${sources.labels.join(", ")}`;
  btn.setAttribute("aria-expanded", "false");
  const list = document.createElement("ul");
  list.className = "refs";
  for (const it of sources.items) {
    const li = document.createElement("li");
    li.textContent = `${it.label} → ${it.ref}`;
    list.appendChild(li);
  }
  btn.onclick = () => {
    const open = list.classList.toggle("open");
    btn.setAttribute("aria-expanded", String(open));
  };
  el.append(btn, list);
}

async function ask(text) {
  text = text.trim();
  if (!text) return;
  bubble("user", text);
  input.value = "";
  send.disabled = true;
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<i></i><i></i><i></i>";
  log.appendChild(typing);
  log.scrollTop = log.scrollHeight;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, shop_id: shop, history: history.slice(-12) }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const data = await res.json();
    typing.remove();
    const el = bubble("bot", data.answer, data.lang);
    sourcesLine(el, data.sources, data.lang);
    if (data.handoff) {
      const h = document.createElement("div");
      h.className = "handoff";
      h.textContent = data.lang === "bn" ? "একজন টিম মেম্বারকে জানানো হয়েছে" : "A team member has been notified";
      el.appendChild(h);
    }
    history.push({ role: "user", content: text }, { role: "assistant", content: data.answer });
  } catch (err) {
    typing.remove();
    bubble("bot", "Sorry, something went wrong. Please try again. / দুঃখিত, আবার চেষ্টা করুন।");
    console.error(err);
  } finally {
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
document.getElementById("chips").addEventListener("click", e => {
  if (e.target.classList.contains("chip")) ask(e.target.textContent);
});

fetch("/api/health").then(r => r.json()).then(h => {
  document.getElementById("engine").textContent = h.engine === "claude" ? "Claude · live" : "offline mode";
}).catch(() => {});
</script>
</body>
</html>
